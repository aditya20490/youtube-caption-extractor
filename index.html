<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Caption Extractor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 14px;
      padding: 30px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    p.sub {
      color: #9b9ba5;
      margin-bottom: 25px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #292933;
      background: #0b0b0f;
      color: #f5f5f5;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #ffd21f;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #e50914;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #b20710;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      display: none;
    }
    #result h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }
    #result .meta {
      color: #9b9ba5;
      font-size: 13px;
      margin-bottom: 15px;
    }
    #captionBox {
      background: #0b0b0f;
      border: 1px solid #292933;
      border-radius: 10px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #d0d0d0;
    }
    .download-btn {
      margin-top: 12px;
      background: #ffd21f;
      color: #000;
      font-weight: 700;
    }
    .download-btn:hover {
      background: #e6b800;
    }
    .error {
      color: #ff6b6b;
      margin-top: 12px;
    }
    .loader {
      display: none;
      margin-top: 15px;
      color: #9b9ba5;
      text-align: center;
    }
    .loader.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 YouTube Caption Extractor</h1>
    <p class="sub">Paste any YouTube video link and get the full caption/transcript</p>

    <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." />
    <button id="extractBtn">Extract Caption</button>

    <div class="loader" id="loader">⏳ Fetching caption...</div>

    <div id="result">
      <h2 id="videoTitle">Video Title</h2>
      <div class="meta" id="videoMeta">Channel • Views • Date</div>
      <div id="captionBox">Caption will appear here...</div>
      <button class="download-btn" id="downloadBtn">⬇ Download as TXT</button>
    </div>

    <div id="errorMessage" class="error"></div>
  </div>

  <script>
    const API_KEY = "AIzaSyAJhYU4aZ7GnFsv-Wd0_2UX9oCzoFRCbOE";

    document.getElementById("extractBtn").addEventListener("click", extractCaption);

    function extractCaption() {
      const urlInput = document.getElementById("youtubeUrl");
      const url = urlInput.value.trim();
      const errorDiv = document.getElementById("errorMessage");
      const resultDiv = document.getElementById("result");
      const loader = document.getElementById("loader");
      const captionBox = document.getElementById("captionBox");

      errorDiv.textContent = "";
      resultDiv.style.display = "none";
      loader.classList.add("show");
      document.getElementById("extractBtn").disabled = true;

      if (!url) {
        errorDiv.textContent = "Please paste a YouTube URL.";
        loader.classList.remove("show");
        document.getElementById("extractBtn").disabled = false;
        return;
      }

      const videoId = extractVideoId(url);
      if (!videoId) {
        errorDiv.textContent = "Invalid YouTube URL. Please check and try again.";
        loader.classList.remove("show");
        document.getElementById("extractBtn").disabled = false;
        return;
      }

      fetchVideoDetails(videoId)
        .then(details => {
          document.getElementById("videoTitle").textContent = details.title;
          document.getElementById("videoMeta").textContent = details.channel + " • " + details.views + " views";
          return fetchCaption(videoId);
        })
        .then(caption => {
          captionBox.textContent = caption || "No captions found for this video.";
          resultDiv.style.display = "block";
          loader.classList.remove("show");
          document.getElementById("extractBtn").disabled = false;
        })
        .catch(err => {
          errorDiv.textContent = err.message || "Something went wrong. Please try again.";
          loader.classList.remove("show");
          document.getElementById("extractBtn").disabled = false;
        });
    }

    function extractVideoId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=)([\w-]+)/,
        /(?:youtu\.be\/)([\w-]+)/,
        /(?:youtube\.com\/embed\/)([\w-]+)/
      ];
      for (const pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      return null;
    }

    async function fetchVideoDetails(videoId) {
      const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${videoId}&key=${API_KEY}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Failed to fetch video details");
      const data = await response.json();
      if (!data.items || data.items.length === 0) {
        throw new Error("Video not found");
      }
      const item = data.items[0];
      return {
        title: item.snippet.title,
        channel: item.snippet.channelTitle,
        views: parseInt(item.statistics.viewCount).toLocaleString()
      };
    }

    async function fetchCaption(videoId) {
      // Try primary proxy
      try {
        const proxyUrl = `https://yt-api.com/api/subtitles?videoId=${videoId}`;
        const response = await fetch(proxyUrl);
        if (response.ok) {
          const data = await response.json();
          if (data.subtitles && data.subtitles.length > 0) {
            return data.subtitles.map(item => item.text).join(' ');
          }
        }
      } catch (e) {
        // Primary failed, try backup
      }

      // Try backup proxy
      try {
        const backupUrl = `https://youtube-transcript.vercel.app/api/transcript?videoId=${videoId}`;
        const backupResponse = await fetch(backupUrl);
        if (backupResponse.ok) {
          const backupData = await backupResponse.json();
          if (backupData.transcript && backupData.transcript.length > 0) {
            return backupData.transcript.map(item => item.text).join(' ');
          }
        }
      } catch (e) {
        // Backup failed
      }

      throw new Error("Could not fetch captions. The video may not have captions or the service is down.");
    }

    document.getElementById("downloadBtn").addEventListener("click", function() {
      const title = document.getElementById("videoTitle").textContent;
      const caption = document.getElementById("captionBox").textContent;
      const blob = new Blob([caption], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${title}-caption.txt`;
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
