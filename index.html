<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Caption Extractor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 14px;
      padding: 30px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    p.sub {
      color: #9b9ba5;
      margin-bottom: 25px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #292933;
      background: #0b0b0f;
      color: #f5f5f5;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #ffd21f;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #e50914;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #b20710;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      display: none;
    }
    #result h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }
    #result .meta {
      color: #9b9ba5;
      font-size: 13px;
      margin-bottom: 15px;
    }
    #captionBox {
      background: #0b0b0f;
      border: 1px solid #292933;
      border-radius: 10px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      color: #d0d0d0;
    }
    .download-btn {
      margin-top: 12px;
      background: #ffd21f;
      color: #000;
      font-weight: 700;
    }
    .download-btn:hover {
      background: #e6b800;
    }
    .error {
      color: #ff6b6b;
      margin-top: 12px;
    }
    .loader {
      display: none;
      margin-top: 15px;
      color: #9b9ba5;
      text-align: center;
    }
    .loader.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 YouTube Caption Extractor</h1>
    <p class="sub">Paste any YouTube video link and get the full caption/transcript</p>

    <input type="text" id="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." />
    <button id="extractBtn">Extract Caption</button>

    <div class="loader" id="loader">⏳ Fetching caption...</div>

    <div id="result">
      <h2 id="videoTitle">Video Title</h2>
      <div class="meta" id="videoMeta">Channel • Views • Date</div>
      <div id="captionBox">Caption will appear here...</div>
      <button class="download-btn" id="downloadBtn">⬇ Download as TXT</button>
    </div>

    <div id="errorMessage" class="error"></div>
  </div>

  <script>
    // JavaScript will go here in Task 5
    console.log("YouTube Caption Extractor is ready!");
  </script>
</body>
</html>
